name: Publish Loang Twenty image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/loang-temporary-access
    paths:
      - .github/workflows/publish-loang-twenty-image.yaml
      - packages/twenty-server/**
      - packages/twenty-shared/**
      - packages/twenty-front/**
      - packages/twenty-docker/twenty/**
      - package.json
      - yarn.lock

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-loang-twenty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Twenty
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/twenty:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the exact image is publicly pullable
        shell: bash
        run: |
          token="$(
            curl --fail --silent --show-error \
              "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/twenty:pull" \
              | jq -r '.token // .access_token // empty'
          )"
          test -n "$token"
          curl --fail --silent --show-error --head \
            --header "Authorization: Bearer $token" \
            --header "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/twenty/manifests/${{ github.sha }}"
