name: Generate Loang GraphQL clients

on:
  push:
    branches:
      - codex/loang-temporary-access
    paths:
      - .github/workflows/generate-loang-codegen.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/loang-temporary-access

      - uses: actions/setup-node@v4
        with:
          node-version: 24.5.0

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn nx run twenty-front:graphql:generate
      - run: yarn nx run twenty-front:graphql:generate --configuration=metadata
      - run: yarn nx run twenty-front:graphql:generate --configuration=admin
      - run: yarn nx run twenty-client-sdk:generate-metadata-client

      - name: Commit generated clients
        shell: bash
        run: |
          git add packages/twenty-front/src/generated \
            packages/twenty-front/src/generated-metadata \
            packages/twenty-front/src/generated-admin \
            packages/twenty-client-sdk/src/metadata/generated
          if git diff --cached --quiet; then
            echo "Generated clients are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate GraphQL clients"
          git push origin HEAD:codex/loang-temporary-access
