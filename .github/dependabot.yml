# Solo seguridad agrupada. SEC-PROACTIVA-LOTE2-1210-B-C1.
# El limite 0 desactiva las PR de versiones; seguridad sigue agrupada por ecosistema.
version: 2
updates:
- package-ecosystem: npm
  schedule:
    interval: daily
  open-pull-requests-limit: 0
  labels:
  - dependencies
  - security
  groups:
    security:
      applies-to: security-updates
      patterns:
      - '*'
  directories:
  - /
  - /packages/twenty-apps/examples/document-generator
  - /packages/twenty-apps/examples/hello-world
  - /packages/twenty-apps/examples/postcard
  - /packages/twenty-apps/internal/*
  - /packages/twenty-apps/internal/real-estate
  - /packages/twenty-apps/internal/self-hosting
  - /packages/twenty-apps/internal/twenty-partners
  - /packages/twenty-apps/public/*
  - /packages/twenty-apps/public/call-recorder
  - /packages/twenty-apps/public/people-data-labs
  - /packages/twenty-apps/public/twenty-discord
  - /packages/twenty-apps/public/twenty-exa
  - /packages/twenty-apps/public/twenty-fireflies
  - /packages/twenty-apps/public/twenty-last-contact
  - /packages/twenty-apps/public/twenty-linear
  - /packages/twenty-apps/public/twenty-slack
  - /packages/twenty-companion
  - /packages/twenty-front
  - /packages/twenty-sdk
  - /packages/twenty-server
  - /packages/twenty-server/src/engine/core-modules/application/application-package/constants/seed-dependencies
  - /packages/twenty-server/src/engine/core-modules/logic-function/logic-function-drivers/constants/common-layer-dependencies
